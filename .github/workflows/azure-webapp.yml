name: Build and deploy to Azure

# Deploys via OIDC federated credentials - no long-lived credentials anywhere.
# Required repository secrets (Settings > Secrets and variables > Actions > Secrets):
#   AZURE_CLIENT_ID        application (client) ID of the Entra app registration
#   AZURE_TENANT_ID        directory (tenant) ID
#   AZURE_SUBSCRIPTION_ID  target subscription ID
#
# These are identifiers rather than credentials, but they are stored as secrets so
# GitHub masks them in the run logs - azure/login echoes its inputs, and this
# repository is public.
# See docs/azure-deployment.md for the one-time Azure setup.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # required to request the OIDC token
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  AZURE_WEBAPP_NAME: finance-tn
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '24.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://finance-tn.azurewebsites.net

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Build React client
        working-directory: client
        run: |
          npm ci
          npm run build

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Bundle SPA into API and publish
        run: |
          rm -rf server/wwwroot && mkdir -p server/wwwroot
          cp -r client/dist/. server/wwwroot/
          dotnet publish server/FinanceManager.Api.csproj -c Release -o publish

      - name: Sign in to Azure (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: publish

      - name: Sign out
        if: always()
        run: az logout
